name: Build & Deploy

on:
  push:
    branches: [master]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: ghcr.io/ollegsey/torpedo-frontend:latest

      - name: Build & push bot
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.bot
          push: true
          tags: ghcr.io/ollegsey/torpedo-bot:latest

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            mkdir -p ~/torpedo-cards
            cd ~/torpedo-cards

            cat > Caddyfile << 'EOF'
            {$DOMAIN} {
                reverse_proxy frontend:80
            }
            EOF

            cat > docker-compose.yml << 'EOF'
            services:
              frontend:
                image: ghcr.io/ollegsey/torpedo-frontend:latest
                restart: unless-stopped

              bot:
                image: ghcr.io/ollegsey/torpedo-bot:latest
                restart: unless-stopped
                environment:
                  BOT_TOKEN: ${BOT_TOKEN}
                  WEBAPP_URL: https://${DOMAIN}

              caddy:
                image: caddy:alpine
                restart: unless-stopped
                ports:
                  - "80:80"
                  - "443:443"
                  - "443:443/udp"
                volumes:
                  - ./Caddyfile:/etc/caddy/Caddyfile:ro
                  - caddy_data:/data
                  - caddy_config:/config
                environment:
                  DOMAIN: ${DOMAIN}

            volumes:
              caddy_data:
              caddy_config:
            EOF

            cat > .env << 'EOF'
            BOT_TOKEN=${{ secrets.BOT_TOKEN }}
            DOMAIN=${{ secrets.DOMAIN }}
            EOF

            docker login ghcr.io -u ollegsey -p ${{ secrets.GITHUB_TOKEN }}
            docker compose down 2>/dev/null || true
            docker compose pull
            docker compose up -d --remove-orphans
