name: Build & Deploy

on:
  push:
    branches: [master]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: ghcr.io/ollegsey/torpedo-frontend:latest

      - name: Build & push bot
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.bot
          push: true
          tags: ghcr.io/ollegsey/torpedo-bot:latest

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            mkdir -p ~/torpedo-cards
            cd ~/torpedo-cards

            # Write docker-compose
            cat > docker-compose.yml << 'EOF'
            services:
              frontend:
                image: ghcr.io/ollegsey/torpedo-frontend:latest
                restart: unless-stopped
                ports:
                  - "127.0.0.1:3001:80"

              bot:
                image: ghcr.io/ollegsey/torpedo-bot:latest
                restart: unless-stopped
                environment:
                  BOT_TOKEN: ${BOT_TOKEN}
                  WEBAPP_URL: https://ollegsey.ru:4443
            EOF

            # Write .env
            cat > .env << 'EOF'
            BOT_TOKEN=${{ secrets.BOT_TOKEN }}
            EOF

            # Write nginx config
            cat > /tmp/torpedo.nginx << 'EOF'
            server {
                listen 80;
                server_name ollegsey.ru;
                location /.well-known/acme-challenge/ {
                    root /var/www/certbot;
                }
                location / {
                    return 301 https://$host:4443$request_uri;
                }
            }
            server {
                listen 4443 ssl http2;
                server_name ollegsey.ru;
                ssl_certificate /etc/letsencrypt/live/ollegsey.ru/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/ollegsey.ru/privkey.pem;
                ssl_protocols TLSv1.2 TLSv1.3;
                ssl_ciphers HIGH:!aNULL:!MD5;
                location / {
                    proxy_pass http://127.0.0.1:3001;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto https;
                }
            }
            EOF

            echo '${{ secrets.SUDO_PASS }}' | sudo -S cp /tmp/torpedo.nginx /etc/nginx/sites-available/torpedo-cards
            echo '${{ secrets.SUDO_PASS }}' | sudo -S ln -sf /etc/nginx/sites-available/torpedo-cards /etc/nginx/sites-enabled/torpedo-cards
            echo '${{ secrets.SUDO_PASS }}' | sudo -S nginx -t
            echo '${{ secrets.SUDO_PASS }}' | sudo -S systemctl reload nginx

            # Pull and start containers
            docker login ghcr.io -u ollegsey -p ${{ secrets.GITHUB_TOKEN }}
            docker compose down 2>/dev/null || true
            docker compose pull
            docker compose up -d
