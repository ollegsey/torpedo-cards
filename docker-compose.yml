services:
  frontend:
    image: ghcr.io/${GITHUB_OWNER}/torpedo-frontend:latest
    restart: unless-stopped

  bot:
    image: ghcr.io/${GITHUB_OWNER}/torpedo-bot:latest
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      WEBAPP_URL: https://${DOMAIN}

  caddy:
    image: caddy:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN}

volumes:
  caddy_data:
  caddy_config:
